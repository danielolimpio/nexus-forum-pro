name: Deploy Lovable via FTP na Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar o repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependências sem travar no lock antigo
        # Correção definitiva para o erro do print: NÃO usar npm ci aqui.
        # O npm ci falha quando o package-lock do GitHub fica divergente.
        # O npm install atualiza/respeita o lock durante a execução e permite
        # que o build siga normalmente no GitHub Actions.
        run: |
          node --version
          npm --version
          npm install --no-audit --no-fund --legacy-peer-deps

      - name: Build do projeto (TanStack Start)
        run: npm run build

      - name: Pré-renderizar index.html via Wrangler
        run: |
          set -e
          # O build do TanStack Start gera um Worker Cloudflare em dist/.
          # Subimos esse Worker localmente com wrangler para capturar o HTML
          # renderizado da rota "/" e usar como shell estática (SPA) na Hostinger.
          if [ ! -d "dist/client" ] || [ ! -d "dist/server" ]; then
            echo "ERRO: build não produziu dist/client e dist/server."
            ls -la dist/ || true
            exit 1
          fi

          echo "Versões em uso:"
          node --version
          npm --version

          echo "Iniciando wrangler dev em background..."
          npx --yes wrangler@4.50.0 dev \
            --config dist/server/wrangler.json \
            --port 8787 \
            --ip 127.0.0.1 \
            --local \
            --log-level warn > wrangler.log 2>&1 &
          WRANGLER_PID=$!

          # Aguarda servidor responder (até 60s)
          echo "Aguardando wrangler iniciar..."
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null "http://127.0.0.1:8787/"; then
              echo "Wrangler pronto."
              break
            fi
            if ! kill -0 "$WRANGLER_PID" 2>/dev/null; then
              echo "ERRO: wrangler encerrou antes de iniciar. Log:"
              cat wrangler.log || true
              exit 1
            fi
            sleep 1
          done

          if ! curl -sf -o /dev/null "http://127.0.0.1:8787/"; then
            echo "ERRO: wrangler não respondeu dentro do tempo limite. Log:"
            cat wrangler.log || true
            kill "$WRANGLER_PID" 2>/dev/null || true
            exit 1
          fi

          # Captura o HTML renderizado de "/"
          curl -sf "http://127.0.0.1:8787/" -o index.html || {
            echo "ERRO: não foi possível capturar index.html"
            cat wrangler.log || true
            kill "$WRANGLER_PID" 2>/dev/null || true
            exit 1
          }

          kill "$WRANGLER_PID" 2>/dev/null || true
          wait "$WRANGLER_PID" 2>/dev/null || true

          if [ ! -s index.html ]; then
            echo "ERRO: index.html vazio."
            exit 1
          fi
          echo "index.html capturado: $(wc -c < index.html) bytes."

      - name: Preparar pasta de deploy estática
        run: |
          set -e
          rm -rf deploy
          mkdir -p deploy
          # Copia todos os assets do client (JS, CSS, imagens) para a raiz do deploy.
          cp -r dist/client/. deploy/
          # Coloca o index.html pré-renderizado como shell da SPA.
          cp index.html deploy/index.html
          # Garante fallback mesmo se o Apache não aplicar rewrite em alguma rota.
          cp index.html deploy/404.html
          cp index.html deploy/403.html
          # Garante que logo e favicon locais sempre vão para a Hostinger.
          cp public/logo.png deploy/logo.png
          cp public/favicon.png deploy/favicon.png

          # .htaccess para SPA fallback no Apache da Hostinger.
          cat > deploy/.htaccess <<'EOF'
          <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            # Permite arquivos e diretórios reais (assets, etc.)
            RewriteCond %{REQUEST_FILENAME} -f [OR]
            RewriteCond %{REQUEST_FILENAME} -d
            RewriteRule ^ - [L]
            # Qualquer outra rota cai no index.html (SPA hydration).
            RewriteRule . /index.html [L]
          </IfModule>

          ErrorDocument 403 /index.html
          ErrorDocument 404 /index.html

          # Cache longo para assets versionados
          <IfModule mod_headers.c>
            <FilesMatch "\.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$">
              Header set Cache-Control "public, max-age=31536000, immutable"
            </FilesMatch>
            <FilesMatch "\.html$">
              Header set Cache-Control "no-cache"
            </FilesMatch>
          </IfModule>

          # Garante que index.html é servido como padrão e remove listagem de diretório.
          DirectoryIndex index.html
          EOF

          echo "Conteúdo final para deploy:"
          ls -la deploy/

      - name: Deploy FTP para a raiz do usuário FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy/
          # Na Hostinger, o usuário FTP do domínio normalmente já aponta para
          # a pasta pública correta. Enviar para ./ evita criar public_html dentro
          # de public_html, que deixa o domínio exibindo 403 por falta de index.html.
          server-dir: ./
          dangerous-clean-slate: false
          dry-run: false
          log-level: standard
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy FTP fallback para public_html da Hostinger
        # Alguns usuários FTP da Hostinger apontam para a pasta da conta,
        # não diretamente para a pasta pública do domínio. Este segundo envio
        # cobre esse cenário sem quebrar o workflow se a pasta não for usada.
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy/
          server-dir: ./public_html/
          dangerous-clean-slate: false
          dry-run: false
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      - name: Deploy FTP fallback para domains/groupeforum.pro/public_html
        # Caminho comum em contas Hostinger com domínio adicional.
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          port: 21
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: ./deploy/
          server-dir: ./domains/groupeforum.pro/public_html/
          dangerous-clean-slate: false
          dry-run: false
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
